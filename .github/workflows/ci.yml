name: CI

on:
  push:
    branches: [main, dezso_dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + dev + api deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      # Skip ML and pullers in CI: they pull large network artefacts.
      - name: Run unit + API tests
        run: |
          pytest -q \
            --ignore=tests/test_burger_citaten.py \
            --ignore=tests/test_raadsinformatie.py \
            --ignore=tests/test_rechtspraak.py \
            --ignore=tests/test_woo.py

      # Lint only the dezso_dev-introduced modules. Pre-existing files have
      # their own style debt that's out of scope for this branch.
      - name: Lint new modules
        run: |
          ruff check \
            src/govmodel/inference.py \
            src/govmodel/api.py \
            src/govmodel/analytics.py \
            src/govmodel/logging_setup.py \
            src/govmodel/seeding.py \
            src/govmodel/errors.py \
            src/govmodel/llm_client.py \
            src/govmodel/training/awb_dataset.py \
            tests/test_api_smoke.py \
            tests/test_analytics.py \
            tests/test_inference_helpers.py \
            tests/test_seeding_and_logging.py \
            tests/test_llm_client.py
