[project]
name = "govmodel"
version = "0.0.1"
description = "Open-source Awb-type-classifier voor inkomende digitale gemeentepost"
requires-python = ">=3.11"
license = { text = "EUPL-1.2" }
authors = [{ name = "Joran van Beek" }]
dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
ml = [
    # Note: install torch separately with the CUDA index for GPU support:
    #   pip install torch --index-url https://download.pytorch.org/whl/cu124
    "torch>=2.4",
    "transformers>=4.45",
    "datasets>=3.0",
    "accelerate>=0.34",
    "scikit-learn>=1.5",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/govmodel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
